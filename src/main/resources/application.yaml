server:
  port: 8083

spring:
  application:
    name: barriodigital-ms-notify
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5s
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        missing-queues-fatal: false
  # Servidor SMTP (Gmail por defecto). Usuario y clave llegan por variables de entorno: nunca en el repositorio.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

barriodigital:
  mail:
    # false: solo simula y registra (desarrollo/pruebas). true: envía de verdad por SMTP.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  messaging:
    exchanges:
      direct: cmd.direct
      topic: cmd.topic
      dead-letter: cmd.dead.dlx
    email:
      queue: q.cmd.email
      dead-letter-queue: q.cmd.email.dlq
      direct-key: email.send
      topic-key: email.*
      dead-letter-key: email.dlq
    crew:
      queue: q.cmd.crew
      dead-letter-queue: q.cmd.crew.dlq
      direct-key: crew.ticket
      topic-key: crew.#
      dead-letter-key: crew.dlq
    certificate:
      queue: q.cmd.certificate
      dead-letter-queue: q.cmd.certificate.dlq
      direct-key: certificate.gen
      topic-key: certificate.*
      dead-letter-key: certificate.dlq

    retry:
      max-attempts: 3
      initial-interval: 1s
      multiplier: 2.0
    idempotency:
      max-entries: 10000
      ttl: 1h
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      # No se consulta al servidor SMTP en cada health check (evita falsos DOWN y conexiones innecesarias).
      enabled: false
