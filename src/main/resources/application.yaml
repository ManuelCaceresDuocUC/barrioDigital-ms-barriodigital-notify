server:
  port: 8083

spring:
  application:
    name: barriodigital-ms-notify
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5s
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        missing-queues-fatal: false

        
barriodigital:
  messaging:
    exchanges:
      direct: cmd.direct
      topic: cmd.topic
      dead-letter: cmd.dead.dlx
    email:
      queue: q.cmd.email
      dead-letter-queue: q.cmd.email.dlq
      direct-key: email.send
      topic-key: email.*
      dead-letter-key: email.dlq
    crew:
      queue: q.cmd.crew
      dead-letter-queue: q.cmd.crew.dlq
      direct-key: crew.ticket
      topic-key: crew.#
      dead-letter-key: crew.dlq
    certificate:
      queue: q.cmd.certificate
      dead-letter-queue: q.cmd.certificate.dlq
      direct-key: certificate.gen
      topic-key: certificate.*
      dead-letter-key: certificate.dlq
    
    retry:
      max-attempts: 3
      initial-interval: 1s
      multiplier: 2.0
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true